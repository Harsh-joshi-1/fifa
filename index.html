<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Redirector</title>
</head>

<body>
  <!-- Admin View -->
  <div id="admin-view" style="display:none;">
    <h2>Redirector Admin</h2>
    <p>Current Target: <a id="current-url" href="#" target="_blank">Loading...</a></p>

    <form id="admin-form">
      <label for="new-url">Change Destination URL:</label><br>
      <input type="text" id="new-url" size="45" required placeholder="https://example.com"><br><br>

      <label for="write-key">Bucket Write Key (if your bucket is protected):</label><br>
      <input type="password" id="write-key" size="45" placeholder="Optional Write Key"><br><br>

      <button type="submit">Save Globally</button>
    </form>

    <p id="status-msg" style="color:green; font-weight:bold;"></p>
    <p><a href="?">Test Redirect (/)</a></p>
  </div>

  <!-- Redirect View -->
  <div id="redirect-view" style="display:none;">
    <p>Redirecting to <a id="dest-link" href="#">...</a></p>
    <p><small>If you are not redirected automatically, click the link above.</small></p>
    <p><a href="#admin"><small>Admin Settings</small></a></p>
  </div>

  <script>
    // Global free persistent Key-Value store (KVdb.io bucket)
    const BUCKET_ID = 'LtMMEANGu6SRaJVRogKVkD';
    const KV_URL = 'https://kvdb.io/' + BUCKET_ID + '/target_url';
    const DEFAULT_URL = 'https://example.com';

    // Route detection
    const path = window.location.pathname;
    const hash = window.location.hash;
    const search = window.location.search;
    const isAdmin = path.endsWith('/admin') ||
      hash === '#admin' ||
      hash === '#/admin' ||
      search.includes('admin');

    if (isAdmin) {
      document.getElementById('admin-view').style.display = 'block';
      const currentUrlEl = document.getElementById('current-url');
      const inputEl = document.getElementById('new-url');
      const writeKeyEl = document.getElementById('write-key');
      const msgEl = document.getElementById('status-msg');

      // Pre-fill write key if saved previously
      writeKeyEl.value = localStorage.getItem('kvdb_write_key') || '';

      // Fetch the current universal truth
      fetch(KV_URL)
        .then(res => res.ok ? res.text() : DEFAULT_URL)
        .then(url => {
          const finalUrl = url.trim() || DEFAULT_URL;
          currentUrlEl.href = finalUrl;
          currentUrlEl.textContent = finalUrl;
          inputEl.value = finalUrl;
        })
        .catch(() => {
          currentUrlEl.href = DEFAULT_URL;
          currentUrlEl.textContent = DEFAULT_URL;
          inputEl.value = DEFAULT_URL;
        });

      // Update the universal truth
      document.getElementById('admin-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        msgEl.style.color = 'black';
        msgEl.textContent = 'Saving universally...';

        let target = inputEl.value.trim();
        if (!/^https?:\/\//i.test(target)) {
          target = 'https://' + target;
        }

        const writeKey = writeKeyEl.value.trim();
        if (writeKey) {
          localStorage.setItem('kvdb_write_key', writeKey);
        }

        try {
          const urlWithToken = writeKey ? `${KV_URL}?access_token=${encodeURIComponent(writeKey)}` : KV_URL;
          const headers = writeKey ? { 'Authorization': `Bearer ${writeKey}` } : {};

          const res = await fetch(urlWithToken, {
            method: 'POST',
            headers: headers,
            body: target
          });

          if (res.ok) {
            currentUrlEl.href = target;
            currentUrlEl.textContent = target;
            inputEl.value = target;
            msgEl.style.color = 'green';
            msgEl.textContent = 'Saved! All visitors worldwide will now be redirected to this link.';
          } else {
            const errText = await res.text();
            throw new Error(`HTTP ${res.status} (${res.statusText}): ${errText || 'Write permission denied'}`);
          }
        } catch (err) {
          msgEl.style.color = 'red';
          msgEl.textContent = `Error: ${err.message}`;
          console.error('Save error:', err);
        }
      });
    } else {
      // Route is / -> fetch universal truth and redirect immediately
      document.getElementById('redirect-view').style.display = 'block';
      const destLink = document.getElementById('dest-link');

      fetch(KV_URL)
        .then(res => res.ok ? res.text() : DEFAULT_URL)
        .then(url => {
          const target = url.trim() || DEFAULT_URL;
          destLink.href = target;
          destLink.textContent = target;
          window.location.replace(target);
        })
        .catch(() => {
          destLink.href = DEFAULT_URL;
          destLink.textContent = DEFAULT_URL;
          window.location.replace(DEFAULT_URL);
        });
    }
  </script>
</body>

</html>
